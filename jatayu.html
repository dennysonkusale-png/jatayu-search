<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jatayu — see what others miss</title>
<meta name="theme-color" content="#ffffff">
<!-- Paste your search-proxy URL here to get real web results. See worker/README.md -->
<meta name="jatayu-proxy" content="">
<style>
:root{
  --bg:#ffffff;--surface:#f4f6f9;--text:#12161c;--muted:#5b6472;--accent:#1f6feb;--border:#e3e8ee;
  --bg-dim:0.45;--bg-blur:0px;--bg-pos:center;--r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.09);
}
*{box-sizing:border-box}
/* An explicit display:flex on a class beats the UA's [hidden] rule, so make
   the attribute authoritative. */
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Nirmala UI",
    "Noto Naskh Arabic","Geeza Pro","Noto Sans JP","Hiragino Sans","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;
  font-size:16px;
}
body.has-img{background-image:var(--bg-img);background-size:cover;background-position:var(--bg-pos);background-attachment:fixed}
body.has-img::before{content:"";position:fixed;inset:-40px;background:rgba(0,0,0,var(--bg-dim));backdrop-filter:blur(var(--bg-blur));z-index:-1}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:800px;margin:0 auto;padding:0 18px}

header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.2px;color:var(--text);cursor:pointer}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:16px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}
select.lang{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px}

main{padding:26px 0 90px;min-height:70vh}
h1.logo{font-size:clamp(34px,9vw,54px);margin:26px 0 4px;letter-spacing:-1.5px;font-weight:800;text-align:center}
.tag{text-align:center;color:var(--muted);margin:0 0 22px;font-size:15px}

form.bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px;padding-inline-start:18px;box-shadow:var(--shadow)}
form.bar:focus-within{border-color:var(--accent)}
form.bar input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:12px 0;font-size:16px}
form.bar input::placeholder{color:var(--muted)}
.mic{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--bg);display:grid;place-items:center;flex:none}
.mic.listening{background:#e5484d;border-color:#e5484d;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 12px rgba(229,72,77,0)}}
.go{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:12px 20px;font-weight:600;flex:none}
.go:hover{filter:brightness(1.08)}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 0}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .x{opacity:.7;font-weight:700}

.note{font-size:12.5px;color:var(--muted);text-align:center;margin:18px auto 0;max-width:560px}
.status{margin:12px auto 0;max-width:600px;font-size:13.5px;text-align:center;color:var(--muted)}
.status.err{color:#c22f34}

.recent{margin-top:26px}
.recent h4,.savedbox h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.rowwrap{display:flex;flex-wrap:wrap;gap:8px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;overflow:auto}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-size:13.5px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff}
.qline{color:var(--muted);font-size:14px;margin:0 0 14px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card .meta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.card .fav{width:16px;height:16px;border-radius:4px;background:var(--accent);opacity:.85;display:inline-block;flex:none}
.card h3{margin:0 0 5px;font-size:17px;line-height:1.35;font-weight:650}
.card h3 a{color:var(--text)}
.card h3 a:hover{color:var(--accent);text-decoration:none}
.card p{margin:0;font-size:14.5px;color:var(--muted)}
.card .row{display:flex;gap:10px;align-items:center;margin-top:9px;font-size:13px}
.badge{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.mediaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mediaTile{position:relative;display:block;border:1px solid var(--border);border-radius:12px;
  overflow:hidden;background:var(--surface);color:inherit;text-decoration:none}
.mediaTile:hover{border-color:var(--accent);text-decoration:none}
.mediaTile img{width:100%;height:108px;object-fit:cover;display:block;background:var(--border)}
.mediaTile .cap{display:block;padding:7px 9px;font-size:12.5px;line-height:1.3;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mediaTile .play{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.62);
  color:#fff;font-size:11px;border-radius:999px;padding:2px 8px}
.empty .btn{margin-top:12px}

/* drawer */
.acct .initials{font-size:12.5px;font-weight:700;letter-spacing:.3px}
.acctMenu{position:fixed;top:62px;inset-inline-end:12px;z-index:60;width:min(260px,86vw);
  background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:12px}
.acctMenu p{margin:0 0 10px;font-size:12.5px;color:var(--muted);word-break:break-all}
.acctMenu .btn{display:block;width:100%;text-align:start;margin-bottom:8px}
.acctMenu .btn:last-child{margin-bottom:0}
.modal{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92vw);
  background:var(--bg);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.modal input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:11px 12px;font-size:15px;margin-bottom:10px;outline:none}
.modal input:focus{border-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(360px,92vw);background:var(--bg);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .25s ease;z-index:40;overflow:auto;padding:18px}
.drawer.open{transform:none}
.drawer h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center}
.drawer h5{margin:20px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{border:1px solid var(--border);border-radius:10px;padding:8px 6px;background:var(--surface);font-size:12px;text-align:center}
.preset i{display:block;height:16px;border-radius:6px;margin-bottom:6px}
.swatchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0;font-size:13.5px}
.swatchrow input[type=color]{width:44px;height:30px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px}
input[type=range]{width:100%}
.field{margin:10px 0}
.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.field input[type=text],.field select,.field input[type=file]{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:9px 11px;font-size:14px}
.warnbox{border:1px solid #e5a500;background:rgba(229,165,0,.1);border-radius:10px;padding:10px;font-size:13px;margin:10px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:13.5px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:#c22f34;border-color:#c22f34}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;display:none}
.scrim.show{display:block}
#dscrim{z-index:35}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 18px 22px;transform:translateY(102%);transition:transform .25s ease;max-height:80vh;overflow:auto}
.sheet.open{transform:none}
.sheet h3{margin:0 0 12px;font-size:16px}
.citylist{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:12px;margin-top:8px}
.citylist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:transparent;padding:10px 12px;font-size:14px}
.citylist button:hover{background:var(--surface)}
.radios{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.grab{width:42px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 12px}

footer{border-top:1px solid var(--border);padding:18px 0 30px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
@media(max-width:560px){
  main{padding-top:10px}
  h1.logo{margin-top:14px}
  .go{padding:12px 16px}
  .card h3{font-size:16px}
}
/* Right-to-left: the drawer enters from the left, and nothing may assume a
   left edge. Arabic is the first locale that exercises this. */
[dir="rtl"] .drawer{right:auto;left:0;border-left:0;border-right:1px solid var(--border);transform:translateX(-102%)}
[dir="rtl"] .drawer.open{transform:none}
[dir="rtl"] form.bar{padding-inline-start:6px;padding-inline-end:18px}
[dir="rtl"] .citylist button{text-align:right}
[dir="rtl"] .swatchrow{flex-direction:row-reverse}
[dir="rtl"] .card h3,[dir="rtl"] .qline,[dir="rtl"] .status,[dir="rtl"] .card p{text-align:right}
/* Results view: the search form moves into the sticky header so a new
   search never requires going back to the home screen. */
body.view-results header.top .wrap{gap:8px}
body.view-results header.top .spacer{display:none}
body.view-results header.top form.bar{flex:1;min-width:0;padding:4px;padding-inline-start:14px;box-shadow:none}
body.view-results header.top form.bar input{padding:8px 0;font-size:15px;min-width:60px}
body.view-results header.top form.bar .go{padding:9px 15px;font-size:14px}
body.view-results header.top form.bar .mic{width:36px;height:36px}
body.view-results .brand span:last-child{display:none}
body.view-results select.lang{max-width:96px;padding:6px 6px;font-size:13px}
@media(max-width:430px){
  /* The search field is the point of this row: give it the space. Language
     and theme both remain reachable from the home screen and Settings. */
  body.view-results select.lang{display:none}
  body.view-results #themeBtn{display:none}
  body.view-results header.top form.bar .go{padding:9px 13px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>
/* Theme boot — runs before paint so there is no flash of the wrong theme. */
(function(){
  try{
    var raw=localStorage.getItem('jatayu.theme'); if(!raw) return;
    var t=JSON.parse(raw), c=t.colors||{}, mode=t.mode||'system';
    var dark = mode==='dark' || (mode==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
    var root=document.documentElement;
    if(c.bg) root.style.setProperty('--bg',c.bg);
    if(c.surface) root.style.setProperty('--surface',c.surface);
    if(c.text) root.style.setProperty('--text',c.text);
    if(c.muted) root.style.setProperty('--muted',c.muted);
    if(c.accent) root.style.setProperty('--accent',c.accent);
    if(c.border) root.style.setProperty('--border',c.border);
    root.dataset.mode = dark?'dark':'light';
  }catch(e){}
})();
</script>
</head>
<body>

<header class="top">
  <div class="wrap" id="topWrap">
    <div class="brand" id="brand"><span class="mark">ज</span><span>Jatayu</span></div>
    <div class="spacer"></div>
    <select class="lang" id="langSel" aria-label="Language">
      <optgroup label="India">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="mr">मराठी</option>
        <option value="sa">संस्कृतम्</option>
      </optgroup>
      <optgroup label="Global">
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
        <option value="ja">日本語</option>
        <option value="zh">简体中文</option>
      </optgroup>
    </select>
    <button class="iconbtn acct" id="acctBtn" aria-label="Account" aria-haspopup="menu">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.3 3.1-5.4 7-5.4s7 2.1 7 5.4"/></svg>
    </button>
    <button class="iconbtn" id="themeBtn" title="Theme" aria-label="Toggle theme">◐</button>
    <button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>

<main>
  <div class="wrap">
    <!-- HOME -->
    <section id="home">
      <h1 class="logo">Jatayu</h1>
      <p class="tag" data-i18n="tagline"></p>

      <form class="bar" id="searchForm" role="search">
        <input id="q" type="search" autocomplete="off" enterkeyhint="search" aria-label="Search">
        <button type="button" class="mic" id="micBtn" aria-label="Voice search" aria-pressed="false" title="Voice search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
        </button>
        <button type="submit" class="go" data-i18n="search"></button>
      </form>

      <div class="chips">
        <button class="chip" id="nearChip" data-i18n="near"></button>
        <button class="chip" id="voiceLangChip" title="Voice language"><span data-i18n="voiceLang"></span> · <span id="voiceLangLabel">en-IN</span></button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="recent" id="recentBox" hidden>
        <h4 data-i18n="recent"></h4>
        <div class="rowwrap" id="recentList"></div>
      </div>

      <div class="recent savedbox" id="savedBox" hidden>
        <h4 data-i18n="saved"></h4>
        <div class="rowwrap" id="savedList"></div>
      </div>

      <p class="note" data-i18n="protoNote"></p>
    </section>

    <!-- RESULTS -->
    <section id="results" hidden>
      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button data-tab="all" class="on" data-i18n="all"></button>
          <button data-tab="images" data-i18n="images"></button>
          <button data-tab="videos" data-i18n="videos"></button>
          <button data-tab="news" data-i18n="news"></button>
          <button data-tab="place" data-i18n="maps"></button>
        </div>
        <div class="spacer"></div>
        <div class="actions">
          <button class="chip" id="pinBtn" data-i18n="pin"></button>
          <button class="chip" id="emailBtn" data-i18n="email"></button>
        </div>
      </div>
      <div class="toolbar" id="locBar" hidden>
        <button class="chip on" id="locChip"></button>
        <button class="chip" id="widenBtn" hidden data-i18n="widen"></button>
      </div>
      <p class="qline" id="qline" aria-live="polite"></p>
      <div id="understood" class="status" hidden></div>
      <p class="note" id="srcNote" style="text-align:start;margin:4px 0 14px"></p>
      <div id="list"></div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© Jatayu — prototype</span>
    <span class="spacer"></span>
    <span data-i18n="footerNote"></span>
    <span style="width:100%;opacity:.8">Places &copy; OpenStreetMap contributors &middot; Summaries from Wikipedia, CC BY-SA</span>
  </div>
</footer>

<!-- ACCOUNT MENU -->
<div class="acctMenu" id="acctMenu" role="menu" hidden>
  <p id="acctWho"></p>
  <button class="btn" id="acctSavedBtn" role="menuitem"></button>
  <button class="btn" id="acctAction" role="menuitem"></button>
</div>

<!-- SIGN-IN MODAL -->
<div class="scrim" id="authScrim"></div>
<div class="modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle" hidden>
  <h3 id="authTitle" data-i18n="signIn"></h3>
  <p data-i18n="localOnlyNote"></p>
  <form id="authForm">
    <label class="sr" for="authEmail" data-i18n="emailLabel"></label>
    <input id="authEmail" type="email" inputmode="email" autocomplete="email" required>
    <div class="btnrow">
      <button class="btn primary" type="submit" data-i18n="continueBtn"></button>
      <button class="btn" type="button" id="authCancel" data-i18n="cancelBtn"></button>
    </div>
  </form>
</div>

<!-- SETTINGS DRAWER -->
<div class="scrim" id="dscrim"></div>
<aside class="drawer" id="drawer" aria-label="Settings">
  <h3><span data-i18n="settings"></span><span class="spacer"></span><button class="iconbtn" id="closeDrawer" aria-label="Close">✕</button></h3>

  <h5 data-i18n="presets"></h5>
  <div class="presets" id="presets"></div>

  <h5 data-i18n="colours"></h5>
  <div id="swatches"></div>
  <div id="warnSlot"></div>

  <h5 data-i18n="bg"></h5>
  <div class="field">
    <label data-i18n="upload"></label>
    <input type="file" id="bgFile" accept="image/*">
    <div class="btnrow"><button class="btn" id="clearImg" data-i18n="none"></button></div>
  </div>
  <div class="field">
    <label><span data-i18n="dim"></span> <span id="dimVal">45%</span></label>
    <input type="range" id="dim" min="0" max="85" value="45">
  </div>
  <div class="field">
    <label><span data-i18n="blur"></span> <span id="blurVal">0px</span></label>
    <input type="range" id="blur" min="0" max="20" value="0">
  </div>
  <div class="field">
    <label data-i18n="position"></label>
    <select id="pos"><option value="top">Top</option><option value="center" selected>Centre</option><option value="bottom">Bottom</option></select>
  </div>

  <div class="btnrow">
    <button class="btn" id="exportBtn" data-i18n="exportT"></button>
    <button class="btn" id="importBtn" data-i18n="importT"></button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button class="btn" id="resetBtn" data-i18n="reset"></button>
  </div>

  <h5 data-i18n="language"></h5>
  <div class="field">
    <label data-i18n="voiceLang"></label>
    <select id="voiceLang">
      <option value="en-IN">English (India)</option>
      <option value="hi-IN">हिन्दी</option>
      <option value="mr-IN">मराठी</option>
      <option value="bn-IN">বাংলা</option>
      <option value="ta-IN">தமிழ்</option>
      <option value="te-IN">తెలుగు</option>
      <option value="gu-IN">ગુજરાતી</option>
      <option value="kn-IN">ಕನ್ನಡ</option>
      <option value="ml-IN">മലയാളം</option>
      <option value="pa-IN">ਪੰਜਾਬੀ</option>
      <option value="or-IN">ଓଡ଼ିଆ</option>
      <option value="ur-IN">اردو</option>
      <option value="es-ES">Español</option>
      <option value="fr-FR">Français</option>
      <option value="ar-SA">العربية</option>
      <option value="ja-JP">日本語</option>
      <option value="zh-CN">简体中文</option>
    </select>

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

/* ============================ storage ============================ */
function loadJSON(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

function idb(){
  return new Promise(function(res,rej){
    try{
      var r = indexedDB.open("jatayu",1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
}
function kvSet(k,v){ return idb().then(function(db){ return new Promise(function(res,rej){
  var tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k);
  tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }); }
function kvGet(k){ return idb().then(function(db){ return new Promise(function(res,rej){
  var rq=db.transaction("kv","readonly").objectStore("kv").get(k);
  rq.onsuccess=function(){res(rq.result);}; rq.onerror=function(){rej(rq.error);}; }); }); }
function kvDel(k){ return idb().then(function(db){ return new Promise(function(res,rej){
  var tx=db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k);
  tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }); }

/* ============================ colour maths ============================ */
function lum(hex){
  var c = hex.replace("#","");
  if(c.length===3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var v = [0,2,4].map(function(i){ return parseInt(c.substr(i,2),16)/255; })
    .map(function(x){ return x<=0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055,2.4); });
  return 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
}
function ratio(a,b){ var l1=lum(a), l2=lum(b); return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05); }
function mix(a,b,tt){
  var pa=a.replace("#",""), pb=b.replace("#","");
  if(pa.length===3) pa=pa[0]+pa[0]+pa[1]+pa[1]+pa[2]+pa[2];
  if(pb.length===3) pb=pb[0]+pb[0]+pb[1]+pb[1]+pb[2]+pb[2];
  var out="#";
  for(var i=0;i<3;i++){
    var x=parseInt(pa.substr(i*2,2),16), y=parseInt(pb.substr(i*2,2),16);
    out += ("0"+Math.round(x+(y-x)*tt).toString(16)).slice(-2);
  }
  return out;
}
/* Auto-fix goes straight to the extreme that maximises contrast — a barely
   passing grey still reads badly, and the user asked for readable. */
function bestText(bg){ return lum(bg) > 0.42 ? "#000000" : "#ffffff"; }

/* ============================ theme engine ============================ */
function defaultTheme(){
  return {version:1,mode:"system",preset:"light",colors:Object.assign({},LIGHT),
          background:{kind:"color",dim:45,blur:0,position:"center",imageId:null}};
}
function effectiveColors(){
  var th=state.theme;
  if(th.preset==="custom") return th.colors;
  var dark = th.mode==="dark" || (th.mode==="system" && matchMedia("(prefers-color-scheme: dark)").matches);
  if(th.preset==="light" || th.preset==="dark"){
    return dark ? Object.assign({},DARK) : Object.assign({},LIGHT);
  }
  return Object.assign({}, (PRESETS[th.preset]||PRESETS.light).colors);
}
function applyTheme(){
  var th=state.theme, c=effectiveColors(), root=document.documentElement;
  root.style.setProperty("--bg",c.bg);
  root.style.setProperty("--surface",c.surface);
  root.style.setProperty("--text",c.text);
  root.style.setProperty("--muted",c.muted);
  root.style.setProperty("--accent",c.accent);
  root.style.setProperty("--border",c.border);
  var bg=th.background||{};
  root.style.setProperty("--bg-dim",(bg.dim||0)/100);
  root.style.setProperty("--bg-blur",(bg.blur||0)+"px");
  root.style.setProperty("--bg-pos",bg.position||"center");
  var dark = lum(c.bg) < 0.4;
  root.dataset.mode = dark ? "dark" : "light";
  var mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.setAttribute("content",c.bg);
  if(bg.kind==="image" && state.imgURL){
    document.body.classList.add("has-img");
    root.style.setProperty("--bg-img","url('"+state.imgURL+"')");
  }else{
    document.body.classList.remove("has-img");
  }
  saveJSON("jatayu.theme", th);
  renderSwatches();
  checkContrast();
}
function setPreset(name){
  state.theme.preset=name;
  var p=PRESETS[name];
  state.theme.mode = p ? (p.mode==="dark"?"dark":"light") : state.theme.mode;
  if(p) state.theme.colors=Object.assign({},p.colors);
  applyTheme();
}
function renderSwatches(){
  var c=effectiveColors(), box=$("#swatches");
  var fields=[["bg","Background"],["surface","Surface"],["text","Text"],["muted","Secondary"],["accent","Accent"],["border","Border"]];
  box.innerHTML = fields.map(function(f){
    return '<div class="swatchrow"><span>'+f[1]+'</span>'+
      '<input type="color" data-k="'+f[0]+'" value="'+c[f[0]]+'" aria-label="'+f[1]+'"></div>';
  }).join("");
  $$('#swatches input[type=color]').forEach(function(inp){
    inp.addEventListener("input",function(){
      state.theme.preset="custom";
      state.theme.colors=Object.assign({},effectiveColors());
      state.theme.colors[inp.dataset.k]=inp.value;
      applyTheme();
    });
  });
}
function checkContrast(){
  var c=effectiveColors(), slot=$("#warnSlot"), r=ratio(c.text,c.bg);
  if(r>=4.5){ slot.innerHTML='<p class="hint">Contrast '+r.toFixed(1)+':1 — passes AA.</p>'; return; }
  slot.innerHTML='<div class="warnbox">'+esc(t("warn"))+' ('+r.toFixed(1)+':1) '+
    '<div class="btnrow"><button class="btn primary" id="autoFix">'+esc(t("fix"))+'</button></div></div>';
  $("#autoFix").addEventListener("click",function(){
    state.theme.preset="custom";
    var cc=Object.assign({},effectiveColors());
    cc.text=bestText(cc.bg,7);
    cc.muted=mix(cc.text,cc.bg,0.14);
    state.theme.colors=cc;
    applyTheme();
  });
}

/* ============================ search ============================ */
function haversine(a,b){
  var R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function isLocal(q){ return LOCAL_RE.test(q); }

var STRONG = {sasta:1,sasti:1,paas:1,pas:1,najik:1,nazdeek:1,javal:1,dawai:1,dukan:1,dukaan:1,
  khana:1,kapde:1,acha:1,accha:1,madhe:1,naukri:1,gaadi:1,gadi:1,ghar:1,paisa:1,kaam:1};

/* Returns {text, count, strong} — only surface the transliteration when it is
   actually telling the user something (two mapped words, or a clearly
   Hindi/Marathi word), so a plain English query is left alone. */
function transliterate(q){
  var words=q.split(/\s+/), count=0, strong=false;
  var out=words.map(function(w){
    var key=w.toLowerCase().replace(/[^a-z]/g,"");
    if(ROMAN[key]){ count++; if(STRONG[key]) strong=true; return ROMAN[key]; }
    return w;
  });
  return {text: out.join(" "), count: count, strong: strong};
}

/* ---------------------------------------------------------------
   Live results.

   There is no crawler behind this file, so results come from two
   public, CORS-enabled sources:
     - Wikipedia's search API, on the subdomain matching the UI language
     - OpenStreetMap's Nominatim, bounded to the active radius, for
       local intent
   Both are called straight from the browser. If either is unreachable
   the app falls back to the built-in demo dataset and says so, rather
   than silently inventing results.
   --------------------------------------------------------------- */
var PROXY = (function(){
  var m = document.querySelector('meta[name="jatayu-proxy"]');
  return (m && m.content) ? m.content.replace(/\/$/, "") : "";
})();

var WIKI_LANG = {en:"en",hi:"hi",mr:"mr",sa:"sa",es:"es",fr:"fr",ar:"ar",ja:"ja",zh:"zh"};
var memCache = {};

function fetchJSON(url, ms){
  var key = url;
  if (memCache[key]) return Promise.resolve(memCache[key]);
  return new Promise(function(resolve){
    var settled = false;
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function(){
      if (settled) return; settled = true;
      if (ctrl) { try { ctrl.abort(); } catch(e){} }
      resolve(null);
    }, ms || 7000);
    var opts = {headers:{Accept:"application/json"}};
    if (ctrl) opts.signal = ctrl.signal;
    fetch(url, opts)
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (settled) return; settled = true; clearTimeout(timer);
        if (j) memCache[key] = j;
        resolve(j);
      })
      .catch(function(){
        if (settled) return; settled = true; clearTimeout(timer);
        resolve(null);
      });
  });
}

function stripHtml(s){
  var d = document.createElement("div");
  d.innerHTML = s || "";
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}

/* If a proxy is configured it is the primary source, because it can reach a
   real web index. Wikipedia remains the fallback, and the default when no
   proxy is set. */
function proxySearch(q){
  if (!PROXY) return Promise.resolve([]);
  var url = PROXY + (PROXY.indexOf("?") > -1 ? "&" : "?") + "q=" + encodeURIComponent(q);
  return fetchJSON(url, 9000).then(function(r){
    if (!r || !Array.isArray(r.results)) return [];
    return r.results.map(function(hit){
      return {
        title: hit.title || hit.url,
        url: hit.url,
        source: hit.source || host(hit.url),
        type: hit.type || "web",
        snippet: hit.snippet || ""
      };
    }).filter(function(hit){ return hit.url; });
  });
}

function wikiSearch(q){
  var lang = WIKI_LANG[state.lang] || "en";
  var url = "https://" + lang + ".wikipedia.org/w/api.php?action=query&list=search" +
            "&srsearch=" + encodeURIComponent(q) + "&srlimit=10&srprop=snippet" +
            "&format=json&origin=*";
  return fetchJSON(url, 7000).then(function(r){
    if (!r || !r.query || !r.query.search) return [];
    return r.query.search.map(function(hit){
      return {
        title: hit.title,
        url: "https://" + lang + ".wikipedia.org/wiki/" +
             encodeURIComponent(String(hit.title).replace(/ /g, "_")),
        source: "Wikipedia",
        type: "web",
        snippet: stripHtml(hit.snippet) || ("Wikipedia article: " + hit.title)
      };
    });
  });
}

/* Wikimedia Commons for images and video: CORS-enabled, no key, and it
   carries licence metadata we can surface honestly. */
function commonsSearch(q, kind){
  var gsr = "filetype:" + (kind === "video" ? "video" : "bitmap");
  var url = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*" +
            "&generator=search&gsrnamespace=6&gsrlimit=24" +
            "&gsrsearch=" + encodeURIComponent(gsr + " " + q) +
            "&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=420";
  return fetchJSON(url, 8000).then(function(r){
    var pages = (r && r.query && r.query.pages) ? r.query.pages : {};
    return Object.keys(pages).map(function(id){
      var p = pages[id], info = (p.imageinfo && p.imageinfo[0]) || {};
      var meta = info.extmetadata || {};
      var lic = meta.LicenseShortName ? stripHtml(meta.LicenseShortName.value) : "";
      var artist = meta.Artist ? stripHtml(meta.Artist.value) : "";
      return {
        title: String(p.title || "").replace(/^File:/, "").replace(/\.[a-z0-9]+$/i, ""),
        url: info.descriptionurl || ("https://commons.wikimedia.org/wiki/" + encodeURIComponent(p.title || "")),
        thumb: info.thumburl || info.url || "",
        source: "Wikimedia Commons",
        type: kind === "video" ? "video" : "image",
        snippet: [artist, lic].filter(Boolean).join(" · ")
      };
    }).filter(function(x){ return x.thumb; });
  });
}

/* Wikinews: the same MediaWiki API, so no key and CORS works. */
var NEWS_LANG = {en:"en",hi:"en",mr:"en",sa:"en",es:"es",fr:"fr",ar:"ar",ja:"ja",zh:"zh"};
function wikinewsSearch(q){
  var lang = NEWS_LANG[state.lang] || "en";
  var url = "https://" + lang + ".wikinews.org/w/api.php?action=query&list=search" +
            "&srsearch=" + encodeURIComponent(q) + "&srlimit=12&srprop=snippet&format=json&origin=*";
  return fetchJSON(url, 7000).then(function(r){
    if (!r || !r.query || !r.query.search) return [];
    return r.query.search.map(function(hit){
      return {
        title: hit.title,
        url: "https://" + lang + ".wikinews.org/wiki/" + encodeURIComponent(String(hit.title).replace(/ /g, "_")),
        source: "Wikinews",
        type: "news",
        snippet: stripHtml(hit.snippet) || hit.title
      };
    });

}

/* "chai near me" -> "chai": local-intent words confuse a place search. */
function placeQuery(q){
  return q.replace(/\b(near|nearby|near me|around|in|me)\b/gi, " ")
          .replace(/\b(paas|pas|najik|nazdeek|javal)\b/gi, " ")
          .replace(/पास|जवळ|आसपास|जवळचे|नजीक/g, " ")
          .replace(/\s+/g, " ").trim() || q;
}

function osmSearch(q, loc, radiusKm){
  var dLat = radiusKm / 111;
  var dLng = radiusKm / (111 * Math.max(0.2, Math.cos(loc.lat * Math.PI / 180)));
  var viewbox = [loc.lng - dLng, loc.lat + dLat, loc.lng + dLng, loc.lat - dLat].join(",");
  var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=12" +
            "&extratags=1&addressdetails=1&bounded=1&viewbox=" + viewbox +
            "&q=" + encodeURIComponent(placeQuery(q));
  return fetchJSON(url, 8000).then(function(arr){
    if (!Array.isArray(arr)) return [];
    return arr.map(function(p){
      var lat = parseFloat(p.lat), lng = parseFloat(p.lon);
      var parts = String(p.display_name || "").split(",");
      return {
        title: p.name || (parts[0] || "Place"),
        url: "https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lng +
             "#map=18/" + lat + "/" + lng,
        source: String(p.type || "place").replace(/_/g, " "),
        type: "place",
        snippet: parts.slice(1, 4).join(",").trim() || "OpenStreetMap place",
        lat: lat, lng: lng,
        distanceKm: haversine(loc, {lat: lat, lng: lng})
      };
    }).filter(function(p){
      return isFinite(p.distanceKm) && p.distanceKm <= radiusKm + 0.5;
    }).sort(function(a, b){ return a.distanceKm - b.distanceKm; });
  });
}

/* Offline fallback: the original demo dataset, used only when live
   sources cannot be reached. Never presented as live results. */
function demoResults(q){
  var terms = q.toLowerCase().split(/\s+/).filter(function(x){ return x.length > 1; });
  var web = DATA.filter(function(d){
    var hay = (d.title + " " + d.snippet + " " + d.keywords).toLowerCase();
    return terms.some(function(term){ return hay.indexOf(term) > -1; });
  });
  var places = ALLPLACES.map(function(p){
    var o = Object.assign({}, p);
    if (state.loc) o.distanceKm = haversine(state.loc, p);
    return o;
  });
  if (state.loc) {
    places = places.filter(function(p){ return p.distanceKm <= state.radius; })
                   .sort(function(a, b){ return a.distanceKm - b.distanceKm; });
  } else {
    places = places.slice(0, 4);
  }
  return web.concat(places.slice(0, 4));
}

function runSearch(q){
  var local = isLocal(q);
  var tab = state.tab || "all";

  /* Each tab has its own source. Nothing here pretends a source exists when
     it does not: the Places tab needs a location, and says so. */
  var jobs;
  if (tab === "images")      jobs = [commonsSearch(q, "bitmap")];
  else if (tab === "videos") jobs = [commonsSearch(q, "video")];
  else if (tab === "news")   jobs = [wikinewsSearch(q)];
  else if (tab === "place")  jobs = [state.loc ? osmSearch(q, state.loc, state.radius) : Promise.resolve([])];
  else {
    var webJob = proxySearch(q).then(function(list){
      return (list && list.length) ? list : wikiSearch(q);
    });
    jobs = [webJob];
    if (state.loc && local) jobs.push(osmSearch(q, state.loc, state.radius));
  }

  return Promise.all(jobs).then(function(res){
    var first = res[0] || [];
    var places = res[1] || [];
    var out;

    if (tab === "images" || tab === "videos" || tab === "news" || tab === "place") {
      out = first;
      state.liveMode = first.length > 0;
    } else {
      var live = (first.length > 0) || (places.length > 0);
      if (live) {
        out = local ? places.concat(first.slice(0, 6)) : first.concat(places.slice(0, 3));
        state.liveMode = true;
      } else {
        out = demoResults(q);
        state.liveMode = false;
      }
    }

    if (tab === "news") out = out.filter(function(r){ return r.type === "news"; });
    if (tab === "place") out = out.filter(function(r){ return r.type === "place"; });
    return out;
  });
}

/* Credit the source that actually produced these results. */
function sourceNames(results){
  var names = [], seen = {};
  (results || []).forEach(function(r){
    var name = r.type === "place" ? "OpenStreetMap"
             : (r.type === "image" || r.type === "video") ? "Wikimedia Commons"
             : r.type === "news" ? "Wikinews"
             : (r.source === "Wikipedia" ? "Wikipedia" : "Web");
    if (!seen[name]) { seen[name] = 1; names.push(name); }
  });
  return names;
}

    return '<article class="card">' +
      '<div class="meta"><span class="fav"></span><span>' + esc(r.source) + '</span>' +

      '<h3><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a></h3>' +
      '<p>' + esc(r.snippet) + '</p>' +

/* ============================ actions ============================ */
function doSearch(q){
  q=(q||"").trim();
  if(!q) return;
  state.lastQuery=q;
  var trans = transliterate(q);
  var u=$("#understood");
  if(trans && (trans.count>=2 || trans.strong) && /^[a-z0-9\s]+$/i.test(q)){
    u.hidden=false; u.textContent = t("understood")+": "+trans.text;
  }else{ u.hidden=true; }

  state.history = [q].concat(state.history.filter(function(h){ return h!==q; })).slice(0,20);
  saveJSON("jatayu.history",state.history);
  showResults(); renderLocBar(); renderHistory();
  renderLoading();
  document.title = q+" — Jatayu";
  window.scrollTo({top:0,behavior:"instant"});
  $("#q").blur();

  /* Stale-response guard: a slow earlier search must not overwrite a
     newer one. */
  var seq = ++state.searchSeq;
  runSearch(q).then(function(out){
    if (seq !== state.searchSeq) return;
    state.results = out;
    renderResults();
    var note = $("#srcNote");
    if (note) {
      var names = sourceNames(state.results);
      note.textContent = state.liveMode
        ? t("sourcesLabel") + ": " + names.join(", ")
        : t("offlineNote");
    }
  });
}

function setLocation(loc){
  state.loc=loc;
  saveJSON("jatayu.loc",loc);
  renderLocBar();
  $("#status").textContent="";
  $("#sheetStatus").textContent="";
  closeSheet();
  if(state.lastQuery) doSearch(state.lastQuery);
}

/* ============================ voice ============================ */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var recog=null, listening=false;

function secureOK(){ return location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1"; }

function setStatus(msg, isErr){
  var s=$("#status"); s.textContent=msg||""; s.className="status"+(isErr?" err":"");
}

function toggleMic(){
  if(!SR){ setStatus(t("micOff"),true); return; }
  if(!secureOK()){ setStatus(t("insecure"),true); return; }
  if(listening){ recog && recog.stop(); return; }
  try{
    recog = new SR();
  }catch(e){ setStatus(t("micOff"),true); return; }
  recog.lang = state.voiceLang;
  recog.interimResults = true;
  recog.continuous = false;
  recog.maxAlternatives = 1;
  var mic=$("#micBtn");
  recog.onstart=function(){
    listening=true; mic.classList.add("listening"); mic.setAttribute("aria-pressed","true");
    setStatus(t("listening"),false);
  };
  recog.onresult=function(ev){
    var interim="", final="";
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var r=ev.results[i];
      if(r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    if(interim) $("#q").value=interim;
    if(final){
      $("#q").value=final.trim();
      if(state.voiceLang==="en-IN"){ doSearch($("#q").value); }
      else { setStatus("",false); $("#q").focus(); }
    }
  };
  recog.onerror=function(ev){
    listening=false; mic.classList.remove("listening"); mic.setAttribute("aria-pressed","false");
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed") setStatus(t("micDenied"),true);
    else if(ev.error==="no-speech") setStatus("No speech detected. Try again.",true);
    else setStatus(t("micOff"),true);
  };
  recog.onend=function(){
    listening=false; mic.classList.remove("listening"); mic.setAttribute("aria-pressed","false");
    if($("#status").textContent===t("listening")) setStatus("",false);
  };
  try{ recog.start(); }catch(e){ setStatus(t("micOff"),true); }
}

/* ============================ email ============================ */
function emailResults(){
  var out=state.results.slice(0,10);
  if(!out.length) return;
  var lines = out.map(function(r,i){
    return (i+1)+". "+r.title+"\n   "+r.url+"\n   "+r.snippet+"\n";
  }).join("\n");
  var body = t("resultsFor")+': "'+state.lastQuery+'"\n'+
    (state.loc ? "Near: "+state.loc.name+" ("+state.radius+" km)\n" : "")+
    "\n"+lines+"\n— Sent from Jatayu (prototype)";
  var href="mailto:?subject="+encodeURIComponent("Jatayu: "+state.lastQuery)+"&body="+encodeURIComponent(body);
  window.location.href=href;
  setStatus(t("mailNote"),false);
}

/* ============================ account ============================
   There is no server behind this. The session is a local record, and the
   interface says so rather than implying a sync that does not exist. */
function initialsOf(email){
  var local = String(email || "").split("@")[0].replace(/[^a-zA-Z0-9]/g, "");
  return (local.slice(0, 2) || "?").toUpperCase();
}
function renderAccount(){
  var btn = $("#acctBtn"), who = $("#acctWho"), action = $("#acctAction");
  if (state.session && state.session.email) {
    btn.innerHTML = '<span class="initials">' + esc(initialsOf(state.session.email)) + '</span>';
    btn.setAttribute("aria-label", t("signedInAs") + " " + state.session.email);
    who.textContent = t("signedInAs") + " " + state.session.email;
    action.textContent = t("signOut");
  } else {
    btn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.3 3.1-5.4 7-5.4s7 2.1 7 5.4"/></svg>';
    btn.setAttribute("aria-label", t("signIn"));
    who.textContent = "";
    action.textContent = t("signIn");
  }
  var savedBtn = $("#acctSavedBtn");
  savedBtn.textContent = t("savedCount") + " (" + state.saved.length + ")";
  savedBtn.hidden = !(state.session && state.session.email);
  var drawerBtn = $("#acctDrawerBtn");
  if (drawerBtn) drawerBtn.textContent = (state.session && state.session.email) ? t("signOut") : t("signIn");
}
function openAuth(){
  $("#acctMenu").hidden = true;
  $("#authModal").hidden = false;
  $("#authScrim").classList.add("show");
  setTimeout(function(){ var i = $("#authEmail"); if (i) i.focus(); }, 30);
}
function closeAuth(){
  $("#authModal").hidden = true;
  $("#authScrim").classList.remove("show");
  var f = $("#authForm"); if (f) f.reset();
}
function signIn(email){
  state.session = { email: email, since: Date.now() };
  saveJSON("jatayu.session", state.session);
  renderAccount();
  closeAuth();
  setStatus(t("signedInAs") + " " + email, false);
}
function signOut(){
  state.session = null;
  localStorage.removeItem("jatayu.session");
  $("#acctMenu").hidden = true;
  renderAccount();
  setStatus("", false);
}

/* ============================ drawer / sheet ============================ */
function openDrawer(){ $("#dscrim").classList.add("show"); $("#drawer").classList.add("open"); }
function closeDrawer(){ $("#dscrim").classList.remove("show"); $("#drawer").classList.remove("open"); }
function openSheet(){ $("#scrim").classList.add("show"); $("#sheet").classList.add("open"); renderCityList(""); }
function closeSheet(){ $("#scrim").classList.remove("show"); $("#sheet").classList.remove("open"); }

function renderCityList(filter){
  var f=(filter||"").toLowerCase();
  var rows=CITIES.filter(function(c){
    return !f || c[0].toLowerCase().indexOf(f)>-1 || c[1].indexOf(f)>-1 || c[2].toLowerCase().indexOf(f)>-1;
  }).slice(0,40);
  $("#cityList").innerHTML = rows.map(function(c,i){
    return '<button data-i="'+CITIES.indexOf(c)+'">'+esc(c[0])+" · "+esc(c[1])+' <span style="color:var(--muted);font-size:12px">'+esc(c[2])+'</span></button>';
  }).join("") || '<div class="empty">—</div>';
  $$("#cityList button").forEach(function(b){
    b.addEventListener("click",function(){
      var c=CITIES[Number(b.dataset.i)];
      setLocation({name:c[0]+", "+c[2],lat:c[3],lng:c[4],source:"city"});
    });
  });
}

/* ============================ init ============================ */
function init(){
  state.theme = loadJSON("jatayu.theme", null) || defaultTheme();
  state.history = loadJSON("jatayu.history", []);
  state.saved = loadJSON("jatayu.saved", []);
  state.loc = loadJSON("jatayu.loc", null);
  state.session = loadJSON("jatayu.session", null);
  if(!PRESETS[state.theme.preset]) state.theme.preset="light";

  applyI18n();
  applyTheme();
  renderHistory(); renderSaved(); renderLocBar(); renderAccount();

  /* presets */
  $("#presets").innerHTML = Object.keys(PRESETS).map(function(k){
    var p=PRESETS[k].colors;
    return '<button class="preset" data-p="'+k+'"><i style="background:linear-gradient(90deg,'+p.bg+','+p.surface+','+p.accent+')"></i>'+k+'</button>';
  }).join("");
  $$("#presets .preset").forEach(function(b){
    b.addEventListener("click",function(){ setPreset(b.dataset.p); });
  });

  /* theme toggle */
  $("#themeBtn").addEventListener("click",function(){
    var dark = document.documentElement.dataset.mode==="dark";
    setPreset(dark ? "light" : "dark");
  });

  /* search */
  $("#searchForm").addEventListener("submit",function(e){ e.preventDefault(); doSearch($("#q").value); });
  $("#q").addEventListener("keydown",function(e){ if(e.key==="Escape"){ $("#q").value=""; } });

  /* mic */
  $("#micBtn").addEventListener("click",toggleMic);
  if(!SR) $("#micBtn").style.display="none";

  /* language */
  $("#langSel").addEventListener("change",function(){
    state.lang=this.value;
    localStorage.setItem("jatayu.lang",state.lang);
    setStatus("",false);
    var mapped = LANG_TO_VOICE[state.lang];
    if(mapped && state.voiceLang.split("-")[0]!==state.lang){
      state.voiceLang = mapped;
      localStorage.setItem("jatayu.voiceLang",state.voiceLang);
    }
    if(state.lang==="sa") setStatus(t("voiceFallback"),false);
    applyI18n(); renderLocBar();
    if(!$("#results").hidden && state.lastQuery) renderResults();
    renderHistory(); renderSaved();
  });

  /* voice language */
  $("#voiceLang").addEventListener("change",function(){
    state.voiceLang=this.value;
    localStorage.setItem("jatayu.voiceLang",state.voiceLang);
    $("#voiceLangLabel").textContent=state.voiceLang;
  });
  $("#voiceLangChip").addEventListener("click",function(){
    var order=["en-IN","hi-IN","mr-IN","bn-IN","ta-IN","te-IN","gu-IN","kn-IN","ml-IN","pa-IN","or-IN","ur-IN"];
    var i=order.indexOf(state.voiceLang);
    state.voiceLang=order[(i+1)%order.length];
    localStorage.setItem("jatayu.voiceLang",state.voiceLang);
    $("#voiceLangLabel").textContent=state.voiceLang;
    $("#voiceLang").value=state.voiceLang;
  });

  /* tabs */
  $$("#tabs button").forEach(function(b){
    b.addEventListener("click",function(){
      $$("#tabs button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on"); state.tab=b.dataset.tab;
      /* runSearch is async now: assigning its Promise to state.results was
         why tab switches rendered nothing. Go through doSearch so the
         loading state and the stale-response guard apply. */
      if(state.lastQuery) doSearch(state.lastQuery);
    });
  });

  /* pin + email */
  $("#pinBtn").addEventListener("click",function(){
    if(!state.lastQuery) return;
    if(state.saved.indexOf(state.lastQuery)===-1) state.saved.unshift(state.lastQuery);
    saveJSON("jatayu.saved",state.saved); renderSaved(); setStatus(t("pinned"),false);
  });
  $("#emailBtn").addEventListener("click",emailResults);

  /* location */
  $("#nearChip").addEventListener("click",openSheet);
  $("#locChip").addEventListener("click",openSheet);
  $("#scrim").addEventListener("click",closeSheet);
  $("#cityFilter").addEventListener("input",function(){ renderCityList(this.value); });
  $("#pinToggle").addEventListener("click",function(){ $("#pinField").hidden=!$("#pinField").hidden; });
  $("#pinGo").addEventListener("click",function(){
    var pin=($("#pinInput").value||"").trim();
    if(!/^\d{6}$/.test(pin)){ $("#sheetStatus").textContent="Enter a 6-digit PIN code."; return; }
    var city=PINMAP[pin.slice(0,3)];
    if(!city){ $("#sheetStatus").textContent="PIN not in the prototype dataset."; return; }
    var row=CITIES.filter(function(c){ return c[0]===city; })[0];
    if(row) setLocation({name:"PIN "+pin+" (near "+city+")",lat:row[3],lng:row[4],source:"pin"});
  });
  $("#geoBtn").addEventListener("click",function(){
    if(!navigator.geolocation){ $("#sheetStatus").textContent=t("locDenied"); return; }
    if(!secureOK()){ $("#sheetStatus").textContent=t("insecure"); return; }
    $("#sheetStatus").textContent="Locating…";
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat=pos.coords.latitude, lng=pos.coords.longitude, best=null, bd=1e9;
      CITIES.forEach(function(c){
        var d=haversine({lat:lat,lng:lng},{lat:c[3],lng:c[4]});
        if(d<bd){ bd=d; best=c; }
      });
      setLocation({name:"My location"+(best?" (near "+best[0]+")":""),lat:lat,lng:lng,source:"geo"});
    },function(){ $("#sheetStatus").textContent=t("locDenied"); },{timeout:8000});
  });
  $("#radiusRow").innerHTML = [1,5,10,25,50].map(function(r){
    return '<button class="chip'+(r===state.radius?" on":"")+'" data-r="'+r+'">'+r+' km</button>';
  }).join("");
  $$("#radiusRow .chip").forEach(function(b){
    b.addEventListener("click",function(){
      state.radius=Number(b.dataset.r);
      localStorage.setItem("jatayu.radius",state.radius);
      $$("#radiusRow .chip").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on"); renderLocBar();
      if(state.lastQuery) doSearch(state.lastQuery);
    });
  });
  $("#widenBtn").addEventListener("click",function(){
    state.radius = state.radius>=25 ? 50 : (state.radius<10?10:state.radius*2.5);
    state.radius = Math.min(50, Math.round(state.radius));
    localStorage.setItem("jatayu.radius",state.radius);
    if(state.lastQuery) doSearch(state.lastQuery);
    renderLocBar();
  });

  /* account */
  $("#acctBtn").addEventListener("click", function(ev){
    ev.stopPropagation();
    var menu = $("#acctMenu");
    menu.hidden = !menu.hidden;
  });
  $("#acctAction").addEventListener("click", function(){
    if (state.session) { signOut(); return; }
    openAuth();
  });
  $("#acctSavedBtn").addEventListener("click", function(){
    $("#acctMenu").hidden = true;
    showHome();
    var box = $("#savedBox");
    if (box) box.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  $("#authCancel").addEventListener("click", closeAuth);
  $("#authScrim").addEventListener("click", closeAuth);
  $("#authForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var email = ($("#authEmail").value || "").trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      setStatus(t("emailLabel") + "?", true);
      return;
    }
    signIn(email);
  });
  document.addEventListener("click", function(ev){
    var menu = $("#acctMenu");
    if (menu.hidden) return;
    if (!menu.contains(ev.target) && ev.target !== $("#acctBtn")) menu.hidden = true;
  });

  /* drawer controls */
  $("#settingsBtn").addEventListener("click",openDrawer);
  $("#closeDrawer").addEventListener("click",closeDrawer);
  $("#dscrim").addEventListener("click",closeDrawer);
  $("#brand").addEventListener("click",function(){ showHome(); closeDrawer(); });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ closeDrawer(); closeSheet(); closeAuth(); $("#acctMenu").hidden = true; }
  });

  $("#dim").addEventListener("input",function(){
    state.theme.background.dim=Number(this.value);
    $("#dimVal").textContent=this.value+"%"; applyTheme();
  });
  $("#blur").addEventListener("input",function(){
    state.theme.background.blur=Number(this.value);
    $("#blurVal").textContent=this.value+"px"; applyTheme();
  });
  $("#pos").addEventListener("change",function(){
    state.theme.background.position=this.value; applyTheme();
  });

  $("#bgFile").addEventListener("change",function(){
    var f=this.files && this.files[0]; if(!f) return;
    if(f.size>8*1024*1024){ alert("Please pick an image under 8 MB."); return; }
    var img=new Image(), fr=new FileReader();
    fr.onload=function(){ img.src=fr.result; };
    img.onload=function(){
      var maxW=1600, scale=Math.min(1,maxW/img.width);
      var cv=document.createElement("canvas");
      cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      var data=cv.toDataURL("image/jpeg",0.82);
      state.imgURL=data;
      state.theme.background.kind="image";
      kvSet("bg",data).catch(function(){});
      applyTheme();
      if(ratio(effectiveColors().text,effectiveColors().bg)<4.5) checkContrast();
    };
    fr.readAsDataURL(f);
  });
  $("#clearImg").addEventListener("click",function(){
    state.imgURL=null; state.theme.background.kind="color";
    kvDel("bg").catch(function(){}); applyTheme();
  });

  $("#exportBtn").addEventListener("click",function(){
    var data=JSON.stringify(state.theme,null,2);
    var blob=new Blob([data],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="jatayu-theme.json"; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  });
  $("#importBtn").addEventListener("click",function(){ $("#importFile").click(); });
  $("#importFile").addEventListener("change",function(){
    var f=this.files && this.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var th=JSON.parse(fr.result);
        if(!th || !th.colors || !th.colors.bg) throw new Error("bad");
        state.theme={version:1,mode:th.mode||"system",preset:th.preset||"custom",
          colors:{bg:th.colors.bg,surface:th.colors.surface||th.colors.bg,text:th.colors.text||"#000",
                  muted:th.colors.muted||th.colors.text||"#555",accent:th.colors.accent||"#1f6feb",
                  border:th.colors.border||th.colors.bg},
          background:th.background||{kind:"color",dim:45,blur:0,position:"center"}};
        applyTheme();
      }catch(e){ alert("That file is not a valid Jatayu theme."); }
    };
    fr.readAsText(f);
  });
  $("#resetBtn").addEventListener("click",function(){
    state.theme=defaultTheme(); state.imgURL=null; state.theme.background.kind="color";
    kvDel("bg").catch(function(){}); applyTheme();
  });

  $("#clearData").addEventListener("click",function(){
    ["jatayu.theme","jatayu.history","jatayu.saved","jatayu.loc","jatayu.radius","jatayu.lang","jatayu.voiceLang"]
      .forEach(function(k){ localStorage.removeItem(k); });
    kvDel("bg").catch(function(){});
    state.theme=defaultTheme(); state.history=[]; state.saved=[]; state.loc=null; state.imgURL=null;
    state.session=null; localStorage.removeItem("jatayu.session");
    state.lang="en"; state.voiceLang="en-IN"; state.radius=10;
    applyI18n(); applyTheme(); renderHistory(); renderSaved(); renderLocBar(); renderAccount(); showHome();
    closeDrawer(); setStatus(t("removed"),false);
  });

  /* restore stored background image */
  kvGet("bg").then(function(data){
    if(data && state.theme.background.kind==="image"){
      state.imgURL=data; applyTheme();
    }
  }).catch(function(){});

  /* follow system theme changes */
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){
    if(state.theme.mode==="system" && (state.theme.preset==="light"||state.theme.preset==="dark")) applyTheme();
  });

  $("#dim").value=state.theme.background.dim||45; $("#dimVal").textContent=($("#dim").value)+"%";
  $("#blur").value=state.theme.background.blur||0; $("#blurVal").textContent=($("#blur").value)+"px";
  $("#pos").value=state.theme.background.position||"center";

  if(!secureOK()) setStatus(t("insecure"),false);
}

document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
